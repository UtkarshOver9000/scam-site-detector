<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Scam Site Detector</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tier {
      font-size: 26px;
      font-weight: 800;
      padding: 6px 0 2px;
      letter-spacing: 0.02em;
    }
    .tier-LOW { color: #10b981; }
    .tier-MEDIUM { color: #f59e0b; }
    .tier-HIGH { color: #f97316; }
    .tier-CRITICAL { color: #ef4444; }
    .score {
      font-size: 12.5px;
      color: #94a3b8;
      margin-bottom: 12px;
      font-family: "Consolas", monospace;
    }
    ul {
      margin: 0;
      padding-left: 18px;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    li { margin-bottom: 6px; }
    .empty { color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🛡️ Scam Site Detector</h1>
  <div id="content"><p class="empty">Loading...</p></div>
  <script src="dist/popup.js"></script>
</body>
</html>
