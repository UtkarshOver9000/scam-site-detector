<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Recipe Hub</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; max-width: 560px; margin: 60px auto; padding: 0 20px; }
  input { display: block; width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
  button { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
  a { color: #64748b; font-size: 13px; }
</style>
</head>
<body>
  <p><a href="index.html">&larr; back</a></p>
  <h1>Welcome back to My Recipe Hub</h1>
  <p>Sign in to save your favorite recipes and manage your meal plan.</p>
  <form action="benign.html" method="post">
    <input type="text" name="username" autocomplete="username" placeholder="Username" />
    <input type="password" name="password" autocomplete="current-password" placeholder="Password" />
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
